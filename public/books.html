<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>千词斩 · 词书</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { padding-bottom: 76px; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 18px 16px; }
    .wrap h1 { font-size: 22px; margin: 0 0 14px; }
    .book-card { position: relative; margin-bottom: 14px; cursor: pointer; border: 2px solid transparent; }
    .book-card.current { border-color: var(--green); }
    .book-card h3 { margin: 0 0 6px; font-size: 18px; }
    .book-card .badge {
      position: absolute; top: 14px; right: 14px; font-size: 12px;
      background: var(--green-light); color: var(--green-dark);
      padding: 4px 10px; border-radius: 12px; font-weight: 600;
    }
    .book-card .total { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .counts { display: flex; gap: 14px; font-size: 13px; margin-bottom: 10px; }
    .counts b.done { color: var(--green-dark); }
    .counts b.learning { color: #d48806; }
    .counts b.untouched { color: var(--muted); }
    .track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
    .fill-done { height: 100%; background: var(--green); float: left; }
    .fill-learning { height: 100%; background: #ffc53d; float: left; }
    .current-tag { font-size: 12px; color: var(--green-dark); font-weight: 600; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid var(--border); padding: 6px 0 max(6px, env(safe-area-inset-bottom)); }
    .bottom-nav a { flex: 1; text-align: center; text-decoration: none; color: var(--muted); font-size: 12px; }
    .bottom-nav a .icon { display: block; font-size: 21px; margin-bottom: 2px; }
    .bottom-nav a.active { color: var(--green-dark); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>词书</h1>
    <div id="list"></div>
  </div>
  <script src="/nav.js"></script>
  <script>renderNav('books');</script>
  <script>
    (async () => {
      const r = await fetch('/api/books');
      if (r.status === 401) { location.href = '/index.html'; return; }
      const { books } = await r.json();
      const list = document.getElementById('list');
      list.innerHTML = books.map(b => {
        const pct = x => b.total ? Math.round(x / b.total * 100) : 0;
        return `
        <div class="card book-card ${b.isCurrent ? 'current' : ''}" data-key="${b.key}">
          ${b.finished ? '<span class="badge">已斩完 ✅</span>' : (b.isCurrent ? '<span class="badge current-tag">当前词书</span>' : '')}
          <h3>${b.title}</h3>
          <div class="total">共 ${b.total} 词</div>
          <div class="counts">
            <span>已斩 <b class="done">${b.done}</b></span>
            <span>学习中 <b class="learning">${b.learning}</b></span>
            <span>未学 <b class="untouched">${b.untouched}</b></span>
          </div>
          <div class="track">
            <div class="fill-done" style="width:${pct(b.done)}%"></div>
            <div class="fill-learning" style="width:${pct(b.learning)}%"></div>
          </div>
        </div>`;
      }).join('');
      // 点卡片切换当前词书（已选中的不重复提交）
      list.querySelectorAll('.book-card').forEach(card => {
        card.onclick = async () => {
          if (card.classList.contains('current')) return;
          const r2 = await fetch('/api/books/current', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: card.dataset.key }),
          });
          if (r2.ok) location.reload();
        };
      });
    })();
  </script>
</body>
</html>
